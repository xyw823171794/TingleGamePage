<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="shift_jis">
<title>いろづきTV</title>
<style>
    body { margin: 0; background: #000; text-align: center; }
    #flashContent { width: 512px; height: 512px; margin: 0 auto; }
    ruffle-player { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="flashContent">
    <!-- 使用 embed 标签直接指向 SWF 文件，Ruffle 会自动替换 -->
    <embed src="swf/index.swf" width="512" height="512"
           type="application/x-shockwave-flash"
           pluginspage="https://ruffle.rs/">
</div>

<!-- 引入 Ruffle 脚本（确保路径正确） -->
<script src="ruffle/ruffle.js"></script>
<script>
    // 配置 Ruffle（可选）
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
        autoplay: "on",
        unmuteOverlay: "hidden",
        splashScreen: false
    };
</script>
</body>
</html>
